spring:
  application:
    name: belajar-sesi2
  datasource:
    # Nilai default hanya untuk lokal (Docker Compose); production WAJIB dari env var
    url: ${DB_URL:jdbc:postgresql://localhost:5432/accounting}
    username: ${DB_USER:accounting}
    password: ${DB_PASS:secret}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # skema milik Flyway, JPA hanya mengecek
  flyway:
    enabled: true                 # default: true
    locations: classpath:db/migration   # default
    validate-on-migrate: true     # default: cek checksum
    clean-disabled: true          # jangan pernah hapus DB production
